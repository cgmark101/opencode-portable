name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build clean distribution package
        shell: powershell
        run: |
          & .\scripts\package-release.ps1 -OutFile "opencode-portable-windows-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: opencode-portable-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
