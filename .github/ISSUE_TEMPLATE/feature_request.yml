name: 💡 Feature Request
description: Suggest an idea or enhancement for OpenCode Portable
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting new features to make this portable edition even better!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What would you like to see added or improved?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case & Motivation
      description: Why would this be beneficial for portable / USB usage?
    validations:
      required: true
